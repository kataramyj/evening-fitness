name: Build offline Android TV APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'tv/**'
      - 'android-tv/**'
      - '.github/workflows/android-tv.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android SDK packages
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: android-tv
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: evening-fitness-tv-apk
          path: android-tv/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
