plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lola.eveningfitness.tv'
    compileSdk 35

    defaultConfig {
        applicationId 'com.lola.eveningfitness.tv'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/site-assets'))
}

def copyTvSite = tasks.register('copyTvSite', Copy) {
    from(layout.projectDirectory.dir('../../tv'))
    into(layout.buildDirectory.dir('generated/site-assets/site'))
    include '**/*'
}
tasks.named('preBuild').configure { dependsOn(copyTvSite) }

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
